name: CI - Test, Coverage, Docker Build & Run

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 4. Run tests with coverage
      - name: Run tests
        run: pytest --cov=app

      # 5. Upload coverage report (optional)
      # Uncomment if you want to upload to Codecov or similar
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v3

  docker:
    needs: test   # This job runs only if 'test' passed
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (optional, but recommended)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image
      - name: Build Docker image
        run: docker build -t flask-ci-docker .

      # 4. Run container in detached mode
      - name: Run container
        run: docker run -d -p 5000:5000 --name ci-test-container flask-ci-docker

      # 5. Wait for container to be ready
      - name: Wait for container
        run: |
          for i in {1..10}; do
            curl -s http://localhost:5000 && break
            echo "Waiting for container to start..."
            sleep 3
          done

      # 6. Verify container response
      - name: Verify response
        run: |
          curl --fail http://localhost:5000 || (docker logs ci-test-container && exit 1)

      # 7. Show container logs (optional)
      - name: Show container logs
        run: docker logs ci-test-container

      # 8. Stop and remove container
      - name: Stop and remove container
        run: |
          docker stop ci-test-container
          docker rm ci-test-container

      # 9. (Optional) Login & push to Docker Hub
      # Uncomment and configure if you want to push your image
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Push Docker image
      #   run: |
      #     docker tag flask-ci-docker yourdockerhubusername/flask-ci-docker:latest
      #     docker push yourdockerhubusername/flask-ci-docker:latest
